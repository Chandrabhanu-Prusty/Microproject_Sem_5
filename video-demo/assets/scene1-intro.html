<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Marque - System Architecture</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: radial-gradient(circle at top, #1e293b, #0f172a);
      color: #f8fafc;
      width: 1280px;
      height: 720px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
      animation: fadeIn 1s ease-in-out;
    }
    .badge {
      display: inline-block;
      padding: 6px 16px;
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid #3b82f6;
      color: #60a5fa;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 34px;
      font-weight: 800;
      background: linear-gradient(to right, #60a5fa, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 16px;
      color: #94a3b8;
    }
    .diagram-card {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      max-width: 1050px;
      animation: scaleIn 1.2s ease-out;
    }
    .diagram-card img {
      width: 100%;
      height: auto;
      max-height: 480px;
      object-fit: contain;
      border-radius: 8px;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>
  <div class="header">
    <div class="badge">VESIT CMPN • Cloud Computing Lab (CSD501)</div>
    <h1>MARQUE: AWS Serverless Campus Event System</h1>
    <div class="subtitle">React 18 • Amazon API Gateway • AWS Lambda (Node.js 22 + TypeScript) • DynamoDB (6 Tables) • S3</div>
  </div>
  <div class="diagram-card">
    <img src="../../docs/images/marque-architecture.png" alt="Marque System Architecture">
  </div>
</body>
</html>
